<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 830" width="2880" height="830" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <!-- Time-of-day gradient: orange (sunrise) to yellow, green, cyan, blue, violet (night). Runs along the bar -->
    <linearGradient id="timeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="8%" stop-color="#ffe600"/>
      <stop offset="30%" stop-color="#7ed321"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="90%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="2880" height="190" fill="#ffffff"/>
  <!-- Elapsed / past shading: adjust x + width to match current time -->
  <rect id="past-overlay" x="1500" y="0" width="1350" height="830" fill="#eef0f3"/>

  <!-- ============ GRID LINES ============ -->
  <g id="grid-lines">
    <line x1="0" y1="70" x2="0" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="60" y1="70" x2="60" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="120" y1="70" x2="120" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="180" y1="70" x2="180" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="240" y1="70" x2="240" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="300" y1="70" x2="300" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="360" y1="70" x2="360" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="420" y1="70" x2="420" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="480" y1="70" x2="480" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="540" y1="70" x2="540" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="600" y1="70" x2="600" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="660" y1="70" x2="660" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="720" y1="70" x2="720" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="780" y1="70" x2="780" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="840" y1="70" x2="840" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="900" y1="70" x2="900" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="960" y1="70" x2="960" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1020" y1="70" x2="1020" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1080" y1="70" x2="1080" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1140" y1="70" x2="1140" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1200" y1="70" x2="1200" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1260" y1="70" x2="1260" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1320" y1="70" x2="1320" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1380" y1="70" x2="1380" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1440" y1="70" x2="1440" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1500" y1="70" x2="1500" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1560" y1="70" x2="1560" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1620" y1="70" x2="1620" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1680" y1="70" x2="1680" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1740" y1="70" x2="1740" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1800" y1="70" x2="1800" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1860" y1="70" x2="1860" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="1920" y1="70" x2="1920" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="1980" y1="70" x2="1980" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2040" y1="70" x2="2040" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2100" y1="70" x2="2100" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2160" y1="70" x2="2160" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2220" y1="70" x2="2220" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2280" y1="70" x2="2280" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2340" y1="70" x2="2340" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2400" y1="70" x2="2400" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2460" y1="70" x2="2460" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2520" y1="70" x2="2520" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2580" y1="70" x2="2580" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2640" y1="70" x2="2640" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2700" y1="70" x2="2700" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2760" y1="70" x2="2760" y2="830" stroke="#8f97a3" stroke-width="1"/>
    <line x1="2820" y1="70" x2="2820" y2="830" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="2880" y1="70" x2="2880" y2="830" stroke="#8f97a3" stroke-width="1"/>
  </g>

  <!-- ============ TIME GRADIENT BAR ============ -->
  <rect x="0" y="52" width="2880" height="4" rx="2" fill="url(#timeGradient)"/>

  <!-- ============ HOUR LABELS ============ -->
  <g id="hour-labels" font-size="22" fill="#8a8f98" text-anchor="middle">
    <text x="4" y="32" text-anchor="start">04:00</text>
    <text x="120" y="32">05:00</text>
    <text x="240" y="32">06:00</text>
    <text x="360" y="32">07:00</text>
    <text x="480" y="32">08:00</text>
    <text x="600" y="32">09:00</text>
    <text x="720" y="32">10:00</text>
    <text x="840" y="32">11:00</text>
    <text x="960" y="32">12:00</text>
    <text x="1080" y="32">13:00</text>
    <text x="1200" y="32">14:00</text>
    <text x="1320" y="32">15:00</text>
    <text x="1440" y="32">16:00</text>
    <text x="1560" y="32">17:00</text>
    <text x="1680" y="32">18:00</text>
    <text x="1800" y="32">19:00</text>
    <text x="1920" y="32">20:00</text>
    <text x="2040" y="32">21:00</text>
    <text x="2160" y="32">22:00</text>
    <text x="2280" y="32">23:00</text>
    <text x="2400" y="32">00:00</text>
    <text x="2520" y="32">01:00</text>
    <text x="2640" y="32">02:00</text>
    <text x="2760" y="32">03:00</text>
    <text x="2854" y="32" text-anchor="end">04:00</text>
  </g>

  <!-- ============ EVENTS ============ -->
  <g id="events">
    <rect class="event-block" x="100" y="75" width="450" height="110" fill="#d8bcf0" fill-opacity="0.45"/>
    <text x="315" y="130" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">cleaning tidying house</text>

    <rect class="event-block" x="800" y="195" width="450" height="110" fill="#d4c9a5" fill-opacity="0.45"/>
    <text x="1025" y="250" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">travelling: cycle</text>

    <rect class="event-block" x="400" y="315" width="450" height="110" fill="#a8f0de" fill-opacity="0.45"/>
    <text x="620" y="370" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">Home</text>

    <rect class="event-block" x="1000" y="435" width="450" height="110" fill="#cdf0a8" fill-opacity="0.45"/>
    <text x="1225" y="490" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">Alone</text>

    <rect class="event-block" x="350" y="555" width="450" height="110" fill="#a8f0a8" fill-opacity="0.45"/>
    <text x="567" y="610" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">Computer</text>

    <rect class="event-block" x="900" y="675" width="450" height="110" fill="#FF9EC0" fill-opacity="0.45"/>
    <text x="1125" y="730" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#3a3d4d">7 - Enjoyed very much</text>


  </g>
</svg>